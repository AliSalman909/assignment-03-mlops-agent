stages:
  preprocess:
    cmd: python training/preprocess.py --input data/raw/churn.csv --output-dir data/processed
    deps:
      - data/raw/churn.csv
      - training/preprocess.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
    metrics:
      - data/processed/stats.json:
          cache: false
