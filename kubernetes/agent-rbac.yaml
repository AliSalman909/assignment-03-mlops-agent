# Restricted identity for the MLOps agent: read the application's resources and patch Deployments
# (restart / scale / rollback) - in the `mlops` namespace only. No delete, no secrets, no
# cluster-wide access. scripts/k8s_agent_kubeconfig.sh turns this into a short-lived kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent
  namespace: mlops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/proxy"]          # in-cluster health checks through the API server
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]                       # restart / scale / rollback (agent also requires user confirmation)
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlops-agent
