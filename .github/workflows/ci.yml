name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # DVC provenance tools read git history and tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure git identity for test fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Lint
        run: ruff check .

      - name: Tests (external services mocked)
        env:
          DVC_NO_ANALYTICS: "1"
        run: pytest -q
